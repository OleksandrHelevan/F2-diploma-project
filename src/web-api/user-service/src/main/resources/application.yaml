spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/users_db}
    username: ${SPRING_DATASOURCE_USERNAME:users_service}
    password: ${SPRING_DATASOURCE_PASSWORD:users_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8081}

local-auth:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:bricklayers-user-service}
  bootstrap-superadmin-username: ${LOCAL_AUTH_BOOTSTRAP_SUPERADMIN_USERNAME:superadmin}
  bootstrap-superadmin-password: ${LOCAL_AUTH_BOOTSTRAP_SUPERADMIN_PASSWORD:}
logging:
  level:
    org.springframework.security: DEBUG