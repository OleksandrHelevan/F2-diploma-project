spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/users_db}
    username: ${SPRING_DATASOURCE_USERNAME:users_service}
    password: ${SPRING_DATASOURCE_PASSWORD:users_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # N replicas x pool size must stay below PostgreSQL max_connections (Lab 3 bottleneck analysis).
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      data-source-properties:
        # Lets pg_stat_activity show which replica owns each connection.
        ApplicationName: ${INSTANCE_ID:${HOSTNAME:user-service}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  thymeleaf:
    cache: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts: a slow or stopped Redis must degrade to PostgreSQL reads, not stall requests.
      connect-timeout: 200ms
      timeout: 200ms
      repositories:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.issuer-uri}
          jwk-set-uri: ${keycloak.jwk-set-uri}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

app:
  instance-id: ${INSTANCE_ID:${HOSTNAME:}}
  datasource:
    read-your-writes-ttl: ${READ_YOUR_WRITES_TTL:5s}
    replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      # One or more comma-separated JDBC URLs; eventual reads are spread round-robin over the healthy ones.
      url: ${DB_REPLICA_URL:jdbc:postgresql://localhost:5436/users_db}
      username: ${DB_REPLICA_USERNAME:${spring.datasource.username}}
      password: ${DB_REPLICA_PASSWORD:${spring.datasource.password}}
      probe-interval-ms: 2000
      pool-size: ${DB_REPLICA_POOL_SIZE:10}
      application-name: ${INSTANCE_ID:${HOSTNAME:user-service}}-replica
  cache:
    enabled: ${CACHE_ENABLED:false}
    ttl-seconds: ${CACHE_TTL_SECONDS:300}
  # Lab 5: the single bounded pool for every @Async method (AsyncConfig).
  async:
    core-size: ${ASYNC_CORE_SIZE:4}
    max-size: ${ASYNC_MAX_SIZE:8}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:50}
    thread-name-prefix: user-async-
    await-termination: 20s
    overview-timeout: ${ASYNC_OVERVIEW_TIMEOUT:2s}
  # notification-service (e-mails). Called after commit, asynchronously, with the user-sync-service token.
  notifications:
    service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    max-attempts: 3
    retry-backoff: 300ms

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8084}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8084/realms/bricklayers}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8084/realms/bricklayers/protocol/openid-connect/certs}
  realm: ${KEYCLOAK_REALM:bricklayers}
  admin:
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:${KEYCLOAK_BASE_URL:http://localhost:8084}}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-sync-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:user-sync-service-secret}
  sync:
    enabled: ${KEYCLOAK_SYNC_ENABLED:false}
    default-role: ${KEYCLOAK_SYNC_DEFAULT_ROLE:BUILDER}
    initial-delay-ms: ${KEYCLOAK_SYNC_INITIAL_DELAY_MS:10000}
    fixed-delay-ms: ${KEYCLOAK_SYNC_FIXED_DELAY_MS:60000}

logging:
  level:
    # Compose lowers this to INFO: per-request DEBUG logging would distort load-test results.
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}

# Prefixed paths let HAProxy route Swagger to the right service: localhost:8080/user-service/swagger-ui.html
springdoc:
  api-docs:
    path: /user-service/v3/api-docs
  swagger-ui:
    path: /user-service/swagger-ui.html
    oauth:
      client-id: bricklayers-web-app
      use-pkce-with-authorization-code-grant: true