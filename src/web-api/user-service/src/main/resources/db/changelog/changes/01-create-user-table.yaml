databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: bricklayers
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_username
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_email
              - column:
                  name: first_name
                  type: VARCHAR(100)
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: company_id
                  type: UUID
              - column:
                  name: keycloak_id
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_users_keycloak_id
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_users_role
            tableName: users
            columns:
              - column:
                  name: role

        - createIndex:
            indexName: idx_users_company_id
            tableName: users
            columns:
              - column:
                  name: company_id

        - sql:
            sql: >-
              ALTER TABLE users
              ADD CONSTRAINT ck_users_role
              CHECK (role IN ('SUPERADMIN','CUSTOMER','FOREMAN','BUILDER','SUPPLIER'))