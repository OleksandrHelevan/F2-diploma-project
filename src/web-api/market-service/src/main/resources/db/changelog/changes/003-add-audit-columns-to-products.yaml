databaseChangeLog:
  - changeSet:
      id: 003-add-audit-columns-to-products
      author: bricklayers
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_modified_by
                  type: VARCHAR(255)
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false