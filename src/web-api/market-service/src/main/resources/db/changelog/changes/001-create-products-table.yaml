databaseChangeLog:
  - changeSet:
      id: 001-create-product-table
      author: bricklayers
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: supplier_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: category
                  type: VARCHAR(100)
              - column:
                  name: unit
                  type: VARCHAR(50)
              - column:
                  name: price
                  type: DOUBLE PRECISION
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: available
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false