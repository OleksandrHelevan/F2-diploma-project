openapi: 3.0.3
info:
  title: Bricklayers Keycloak API
  version: 1.0.0
  description: >
    Keycloak endpoints used by the Bricklayers services for OIDC login,
    service-account administration, role assignment,
    and password updates. See https://www.keycloak.org/docs-api/latest/rest-api/
    for the complete Keycloak Admin REST API.
servers:
  - url: http://localhost:8084
    description: Local Keycloak instance
tags:
  - name: OpenID Connect
  - name: User administration
  - name: Role administration
paths:
  /realms/{realm}/protocol/openid-connect/token:
    post:
      tags: [OpenID Connect]
      summary: Obtain an access token
      description: Obtain a token using an enabled grant. User login uses the hosted authorization-code flow.
      parameters:
        - $ref: '#/components/parameters/realm'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id:
                  type: string
                client_secret:
                  type: string
                  format: password
      responses:
        '200':
          description: Token issued by Keycloak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid credentials, client, or grant
  /admin/realms/{realm}/users:
    get:
      tags: [User administration]
      summary: List users
      security:
        - keycloak: [openid, profile, email]
      parameters:
        - $ref: '#/components/parameters/realm'
        - name: first
          in: query
          schema:
            type: integer
            default: 0
        - name: max
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Users in the realm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRepresentation'
        '401':
          description: Missing or invalid access token
        '403':
          description: Service account lacks permission
    post:
      tags: [User administration]
      summary: Create a user
      security:
        - keycloak: [openid, profile, email]
      parameters:
        - $ref: '#/components/parameters/realm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRepresentation'
      responses:
        '201':
          description: User created; Location header contains the user ID
        '409':
          description: Username or email already exists
  /admin/realms/{realm}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/realm'
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [User administration]
      summary: Delete a user
      security:
        - keycloak: [openid, profile, email]
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found
  /admin/realms/{realm}/users/{userId}/role-mappings/realm:
    parameters:
      - $ref: '#/components/parameters/realm'
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Role administration]
      summary: Get a user's realm roles
      security:
        - keycloak: [openid, profile, email]
      responses:
        '200':
          description: Realm roles assigned to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRepresentation'
    post:
      tags: [Role administration]
      summary: Assign realm roles to a user
      security:
        - keycloak: [openid, profile, email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoleRepresentation'
      responses:
        '204':
          description: Role assignment completed
  /admin/realms/{realm}/roles/{roleName}:
    get:
      tags: [Role administration]
      summary: Get a realm role
      security:
        - keycloak: [openid, profile, email]
      parameters:
        - $ref: '#/components/parameters/realm'
        - name: roleName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Realm role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRepresentation'
        '404':
          description: Role not found
  /admin/realms/{realm}/users/{userId}/reset-password:
    put:
      tags: [User administration]
      summary: Set a user's password
      security:
        - keycloak: [openid, profile, email]
      parameters:
        - $ref: '#/components/parameters/realm'
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRepresentation'
      responses:
        '204':
          description: Password updated
        '404':
          description: User not found
components:
  securitySchemes:
    keycloak:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8084/realms/bricklayers/protocol/openid-connect/auth
          tokenUrl: http://localhost:8084/realms/bricklayers/protocol/openid-connect/token
          scopes:
            openid: Authenticate users
            profile: Read user profile
            email: Read email address
  parameters:
    realm:
      name: realm
      in: path
      required: true
      schema:
        type: string
        example: bricklayers
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
    UserRepresentation:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        enabled:
          type: boolean
        emailVerified:
          type: boolean
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRepresentation'
    CredentialRepresentation:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          example: password
        value:
          type: string
          format: password
        temporary:
          type: boolean
    RoleRepresentation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
