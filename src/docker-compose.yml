name: bricklayers
services:

  postgres-users:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-bricklayers-users-db}
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
      POSTGRES_USER: ${USERS_DB_USER:-users_service}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: ${DB_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${DB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${DB_HEALTHCHECK_RETRIES:-10}

  market-db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: bricklayers-market-db
    environment:
      POSTGRES_DB: market_db
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    ports:
      - "5434:5432"
    volumes:
      - market_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U market -d market_db" ]
      interval: ${DB_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${DB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${DB_HEALTHCHECK_RETRIES:-10}

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-25.0}
    container_name: ${KEYCLOAK_CONTAINER_NAME:-bricklayers-keycloak}
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://${KEYCLOAK_HOST:-localhost}:${AUTH_SERVICE_PORT:-8084}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-false}
      KC_HTTP_ENABLED: ${KEYCLOAK_HTTP_ENABLED:-true}
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    ports:
      - "${AUTH_SERVICE_PORT:-8084}:8080"
    volumes:
      - "${KEYCLOAK_REALM_FILE:-./keycloak/bricklayers-realm.json}:/opt/keycloak/data/import/bricklayers-realm.json"
      - ./keycloak/themes:/opt/keycloak/themes:ro
  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # Lab 5: SMTP sink for notification e-mails. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # Database of notification-service (outbox + Quartz job store)
  notifications-db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    environment:
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME:-notifications_db}
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER:-notifications_service}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_password}
    volumes:
      - notifications_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Labs 5-6: e-mail notifications. Internal API only (no load-balancer route); replicas form one Quartz cluster.
  notification-service:
    build:
      context: ./web-api
      dockerfile: notification-service/Dockerfile
    image: bricklayers/notification-service:labs
    deploy:
      replicas: ${NOTIFICATION_SERVICE_REPLICAS:-2}
    depends_on:
      notifications-db:
        condition: service_healthy
      mailpit:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://notifications-db:5432/${NOTIFICATIONS_DB_NAME:-notifications_db}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATIONS_DB_USER:-notifications_service}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_password}
      KEYCLOAK_ISSUER_URI: http://${KEYCLOAK_HOST:-localhost}:${AUTH_SERVICE_PORT:-8084}/realms/${KEYCLOAK_REALM:-bricklayers}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-bricklayers}/protocol/openid-connect/certs
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_PROVIDER_LATENCY: ${MAIL_PROVIDER_LATENCY:-1s}
      ASYNC_CORE_SIZE: ${NOTIFICATION_ASYNC_CORE_SIZE:-4}
      ASYNC_MAX_SIZE: ${NOTIFICATION_ASYNC_MAX_SIZE:-8}
      ASYNC_QUEUE_CAPACITY: ${NOTIFICATION_ASYNC_QUEUE_CAPACITY:-50}
      QUARTZ_TIME_ZONE: ${QUARTZ_TIME_ZONE:-Europe/Kyiv}
      NOTIFICATION_RETRY_INTERVAL: ${NOTIFICATION_RETRY_INTERVAL:-60s}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  user-service:
    build:
      context: ./web-api
      dockerfile: user-service/Dockerfile
    image: bricklayers/user-service:labs
    deploy:
      replicas: ${USER_SERVICE_REPLICAS:-2}
    cpus: ${USER_SERVICE_CPUS:-0}
    depends_on:
      postgres-users:
        condition: service_healthy
      keycloak:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      REDIS_HOST: redis
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-INFO}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-users:5432/${USERS_DB_NAME:-users_db}
      SPRING_DATASOURCE_USERNAME: ${USERS_DB_USER:-users_service}
      SPRING_DATASOURCE_PASSWORD: ${USERS_DB_PASSWORD:-users_password}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://${KEYCLOAK_HOST:-localhost}:${AUTH_SERVICE_PORT:-8084}/realms/${KEYCLOAK_REALM:-bricklayers}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-bricklayers}/protocol/openid-connect/certs
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-bricklayers}
      KEYCLOAK_ADMIN_CLIENT_ID: user-sync-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-user-sync-service-secret}
      KEYCLOAK_SYNC_ENABLED: ${KEYCLOAK_SYNC_ENABLED:-true}
      # Lab 5: bounded async pool; e-mails are handed to notification-service after commit
      ASYNC_CORE_SIZE: ${ASYNC_CORE_SIZE:-4}
      ASYNC_MAX_SIZE: ${ASYNC_MAX_SIZE:-8}
      ASYNC_QUEUE_CAPACITY: ${ASYNC_QUEUE_CAPACITY:-50}
      # Docker DNS returns every replica; the request id makes retries safe.
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  keycloak-swagger:
    image: swaggerapi/swagger-ui:v5.18.2
    container_name: ${KEYCLOAK_SWAGGER_CONTAINER_NAME:-bricklayers-keycloak-swagger}
    environment:
      URL: /keycloak-openapi.yaml
      OAUTH_CLIENT_ID: bricklayers-web-app
      OAUTH_USE_PKCE: "true"
    ports:
      - "${KEYCLOAK_SWAGGER_PORT:-8085}:8080"
    volumes:
      - ./keycloak/openapi.yaml:/usr/share/nginx/html/keycloak-openapi.yaml:ro

  project-service:
    build:
      context: ./web-api
      dockerfile: market-service/Dockerfile
    container_name: ${PROJECT_SERVICE_CONTAINER_NAME:-bricklayers-project-service}
    environment:
      SERVER_PORT: ${PROJECT_SERVICE_INTERNAL_PORT:-8082}
    ports:
      - "${PROJECT_SERVICE_PORT:-8082}:${PROJECT_SERVICE_INTERNAL_PORT:-8082}"

  chat-service:
    build:
      context: ./web-api
      dockerfile: chat-service/Dockerfile
    image: bricklayers/chat-service:labs
    deploy:
      replicas: ${CHAT_SERVICE_REPLICAS:-2}
    depends_on:
      keycloak:
        condition: service_started
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      CHAT_EVENTS_RELAY: redis
      REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: ${MONGO_URI:?Set MONGO_URI in src/.env to your MongoDB Atlas connection string}
      SPRING_DATA_MONGODB_NAME: ${SPRING_DATA_MONGODB_NAME:-chat_db}
      USER_SERVICE_URL: ${USER_SERVICE_INTERNAL_URL:-http://lb:8080}
      KEYCLOAK_ISSUER_URI: http://${KEYCLOAK_HOST:-localhost}:${AUTH_SERVICE_PORT:-8084}/realms/${KEYCLOAK_REALM:-bricklayers}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-bricklayers}/protocol/openid-connect/certs
      CHAT_DEMO_ENABLED: ${CHAT_DEMO_ENABLED:-false}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  lb:
    image: haproxy:${HAPROXY_VERSION:-3.0-alpine}
    environment:
      LB_ALGORITHM: ${LB_ALGORITHM:-roundrobin}
    volumes:
      - ./infra/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${LB_PORT:-8080}:8080"
      - "127.0.0.1:${LB_STATS_PORT:-8404}:8404"
    depends_on:
      user-service:
        condition: service_started
      chat-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/lb-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  load:
    image: grafana/k6:${K6_VERSION:-0.57.0}
    profiles: [tools]
    entrypoint: ["k6", "run", "/scripts/scaling.js"]
    environment:
      BASE_URL: http://lb:8080
      TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-bricklayers}/protocol/openid-connect/token
      LOAD_USER: ${LOAD_USER:-worker}
      LOAD_PASSWORD: ${LOAD_PASSWORD:-worker}
      VUS: ${VUS:-20}
      DURATION: ${DURATION:-30s}
      RUN_NAME: ${RUN_NAME:-manual}
      SLOW_INSTANCE: ${SLOW_INSTANCE:-}
      INSTANCE_IDS: ${INSTANCE_IDS:-}
      REQUIRE_NO_ERRORS: ${REQUIRE_NO_ERRORS:-false}
    volumes:
      - ./load-tests:/scripts:ro
      - ./results:/results

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: ${WEB_APP_CONTAINER_NAME:-bricklayers-web-app}
    depends_on:
      lb:
        condition: service_started
      project-service:
        condition: service_started
    ports:
      - "${WEB_APP_PORT:-3000}:${WEB_APP_INTERNAL_PORT:-3000}"

volumes:
  users_db_data:
    name: ${USERS_DB_VOLUME:-users_db_data}
  market_db_data:
    name: market_db_data
  notifications_db_data:
    name: ${NOTIFICATIONS_DB_VOLUME:-notifications_db_data}
