# Single entry point for the user-service and chat-service replicas (Lab 3).
# Backend containers publish no ports: clients reach them only through this proxy.

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout check 2s
    # Upgraded WebSocket connections (/ws) stay open far longer than ordinary HTTP requests.
    timeout tunnel 1h
    retries 2
    # Retry only when the TCP connection could not be established, so a sent POST is never replayed.
    retry-on conn-failure
    option redispatch

# Docker's embedded DNS returns one A record per replica of a compose service.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s
    hold nx 1s
    hold timeout 1s
    hold refused 1s

frontend public_http
    bind :8080
    # Liveness of the proxy itself; backend readiness is checked separately per server.
    monitor-uri /lb-health
    # /chat-service/* is chat-service's Swagger UI; /user-service/* falls through to the default backend.
    acl is_chat path_beg /api/v1/chats /ws /chat-service/
    use_backend chat_service if is_chat
    default_backend user_service

# LB_ALGORITHM: roundrobin | leastconn | source (IP hash). Switch with: docker compose up -d --force-recreate lb
backend user_service
    balance "${LB_ALGORITHM}"
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Up to 10 replicas discovered via DNS; 2 failed probes remove a node, 2 successful ones readmit it.
    server-template user 1-10 user-service:8081 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none

backend chat_service
    balance "${LB_ALGORITHM}"
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template chat 1-10 chat-service:8083 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none

# Read-only statistics page: per-server state (UP/DOWN), sessions and request counts.
frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
