global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout check 2s
    timeout tunnel 1h
    retries 2
    retry-on conn-failure
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s
    hold nx 1s
    hold timeout 1s
    hold refused 1s

frontend public_http
    bind :8080
    monitor-uri /lb-health
    acl is_chat path_beg /api/v1/chats /ws /chat-service/
    # Internal e-mail API: exposed only for its Swagger UI; the API itself admits the user-service
    # service account and SUPERADMIN (notification-service SecurityConfig).
    acl is_notification path_beg /api/v1/notifications /notification-service/
    use_backend chat_service if is_chat
    use_backend notification_service if is_notification
    default_backend user_service

backend user_service
    balance "${LB_ALGORITHM}"
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template user 1-10 user-service:8081 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none

backend chat_service
    balance "${LB_ALGORITHM}"
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template chat 1-10 chat-service:8083 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none

backend notification_service
    balance "${LB_ALGORITHM}"
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template notification 1-10 notification-service:8086 check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
