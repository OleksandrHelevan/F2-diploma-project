# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-swagger
  namespace: bricklayers
  labels:
    app.kubernetes.io/name: keycloak-swagger
    app.kubernetes.io/part-of: bricklayers
    mascot: гарбуз
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-swagger
      mascot: гарбуз
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-swagger
        app.kubernetes.io/part-of: bricklayers
        mascot: гарбуз
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      containers:
        - name: swagger-ui
          image: swaggerapi/swagger-ui:v5.18.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: URL
              value: /keycloak-openapi.yaml
            - name: OAUTH_CLIENT_ID
              value: bricklayers-web-app
            - name: OAUTH_USE_PKCE
              value: "true"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: openapi
              mountPath: /usr/share/nginx/html/keycloak-openapi.yaml
              subPath: keycloak-openapi.yaml
              readOnly: true
      volumes:
        - name: openapi
          configMap:
            name: keycloak-openapi
            items:
              - key: keycloak-openapi.yaml
                path: keycloak-openapi.yaml
