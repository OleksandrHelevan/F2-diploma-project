# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: bricklayers
  labels:
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/part-of: bricklayers
    mascot: гарбуз
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-service
      mascot: гарбуз
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-service
        app.kubernetes.io/part-of: bricklayers
        mascot: гарбуз
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      containers:
        - name: chat-service
          image: bricklayers/chat-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: bricklayers-config
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: bricklayers-secrets
                  key: mongodb-uri
            - name: CHAT_DEMO_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: bricklayers-config
                  key: CHAT_DEMO_ENABLED
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
