# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: bricklayers
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: bricklayers
    mascot: гарбуз
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      mascot: гарбуз
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: bricklayers
        mascot: гарбуз
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: bricklayers-config
                  key: SPRING_DATA_MONGODB_NAME
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
