# DVO-L4-3C8B52
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: bricklayers
  labels:
    app.kubernetes.io/part-of: bricklayers
    mascot: гарбуз
  annotations:
    devops-lab/mascot-approved: "true"
data:
  bricklayers-realm.json: |
    {
      "realm": "bricklayers",
      "enabled": true,
      "registrationAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "loginTheme": "bricklayers",
      "roles": {
        "realm": [
          {
            "name": "SUPERADMIN",
            "description": "Full user CUD via API/UI"
          },
          {
            "name": "CUSTOMER",
            "description": "Bricklayers customer"
          },
          {
            "name": "FOREMAN",
            "description": "Site foreman"
          },
          {
            "name": "BUILDER",
            "description": "Builder worker"
          },
          {
            "name": "SUPPLIER",
            "description": "Supplier"
          }
        ]
      },
      "clients": [
        {
          "clientId": "user-service",
          "name": "user-service",
          "enabled": true,
          "publicClient": false,
          "bearerOnly": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "fullScopeAllowed": true,
          "protocolMappers": [
            {
              "name": "user-service audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "user-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "chat-service audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "chat-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email"
          ]
        },
        {
          "clientId": "user-sync-service",
          "name": "user-sync-service",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "fullScopeAllowed": true,
          "defaultClientScopes": [
            "roles"
          ]
        },
        {
          "clientId": "chat-service",
          "name": "chat-service",
          "enabled": true,
          "publicClient": false,
          "bearerOnly": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "fullScopeAllowed": true
        },
        {
          "clientId": "bricklayers-web-app",
          "name": "bricklayers-web-app",
          "enabled": true,
          "publicClient": true,
          "redirectUris": [
            "http://localhost:3000/*",
            "http://localhost:8081/swagger-ui/oauth2-redirect.html",
            "http://localhost:8083/swagger-ui/oauth2-redirect.html",
            "http://localhost:8085/oauth2-redirect.html"
          ],
          "webOrigins": [
            "http://localhost:3000",
            "http://localhost:8081",
            "http://localhost:8083",
            "http://localhost:8085"
          ],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "fullScopeAllowed": true,
          "protocolMappers": [
            {
              "name": "user-service audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "user-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "chat-service audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "chat-service",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email"
          ]
        }
      ]
    }
