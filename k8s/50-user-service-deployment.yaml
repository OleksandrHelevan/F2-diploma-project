# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: bricklayers
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: bricklayers
    mascot: гарбуз
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
      mascot: гарбуз
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: bricklayers
        mascot: гарбуз
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      containers:
        - name: user-service
          image: bricklayers/user-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: bricklayers-config
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bricklayers-secrets
                  key: postgres-password
            - name: KEYCLOAK_SYNC_ENABLED
              value: "false"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
