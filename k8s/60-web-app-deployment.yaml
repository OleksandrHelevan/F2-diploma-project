# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: bricklayers
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: bricklayers
    mascot: гарбуз
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-app
      mascot: гарбуз
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-app
        app.kubernetes.io/part-of: bricklayers
        mascot: гарбуз
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      containers:
        - name: web-app
          image: bricklayers/web-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
